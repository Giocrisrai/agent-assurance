[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-assurance"
version = "0.1.0"
description = "Metodologia y arnes de pruebas para evaluar la seguridad de agentes y aplicaciones LLM en produccion (OWASP LLM Top 10 / NIST AI RMF)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Giocrisrai Godoy Bonillo", email = "contact@giocrisrai.com" }]
keywords = ["llm", "security", "owasp", "red-teaming", "ai-assurance", "prompt-injection"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Information Technology",
  "Topic :: Security",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[project.scripts]
agent-assurance = "agent_assurance.cli:main"

[project.urls]
Homepage = "https://github.com/Giocrisrai/agent-assurance"
Issues = "https://github.com/Giocrisrai/agent-assurance/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_assurance"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
